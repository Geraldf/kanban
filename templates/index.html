<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KARL STORZ - Kanban Board</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Helvetica, Arial, sans-serif;
        background: #eef1f5;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      header {
        background: #073f89;
        color: #fff;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
      }

      header h1 {
        font-size: 1.25rem;
        white-space: nowrap;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .filter-bar {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .filter-bar label {
        font-size: 0.9rem;
        font-weight: 500;
      }

      .filter-bar select {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        font-size: 0.9rem;
        font-family: inherit;
      }

      .file-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      .file-bar .filename {
        font-size: 0.82rem;
        opacity: 0.8;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-bar button {
        padding: 6px 14px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 0.85rem;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s;
      }

      .file-bar button:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        padding: 12px 24px;
        background: #fff;
        border-bottom: 1px solid #d0d5dc;
        align-items: center;
      }

      .legend-title {
        font-size: 0.82rem;
        font-weight: 600;
        color: #162D59;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.78rem;
        color: #444;
      }

      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
      }

      .board-wrapper {
        overflow: auto;
        padding: 2px;
        flex: 1;
        min-height: 0;
      }

      .board-table {
        border-collapse: separate;
        border-spacing: 8px;
        min-width: 100%;
      }

      .board-table th {
        background: #3a63b8;
        color: #fff;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        min-width: 200px;
        text-align: left;
        position: sticky;
        top: 0;
        z-index: 10;
        cursor: grab;
        -webkit-user-select: none;
        user-select: none;
      }

      .board-table th:active {
        cursor: grabbing;
      }

      .board-table th.dragging {
        opacity: 0.4;
      }

      .board-table th.drag-over {
        outline: 2px dashed #fff;
        outline-offset: -4px;
      }

      .board-table th.jg-header {
        background: #162D59;
        min-width: 20px;
        width: 20px;
        text-align: center;
        cursor: pointer;
        user-select: none;
        position: relative;
      }

      .board-table th.jg-header:hover {
        background: #1e3a6e;
      }

      .board-table th.jg-header .toggle {
        display: inline-block;
        width: 18px;
        margin-right: 4px;
        transition: transform 0.2s;
        font-size: 0.9rem;
      }

      .board-table th.jg-header.all-collapsed .toggle {
        transform: rotate(-90deg);
      }

      .swimlane-label {
        background: #162D59;
        color: #fff;
        padding: 10px 10px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 700;
        text-align: center;
        vertical-align: top;
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        white-space: nowrap;
      }

      .swimlane-label:hover {
        background: #1e3a6e;
      }

      .swimlane-label .toggle {
        display: inline-block;
        width: 18px;
        margin-right: 6px;
        transition: transform 0.2s;
      }

      .swimlane-label.collapsed .toggle {
        transform: rotate(-90deg);
      }

      tr.collapsed td.cell {
        display: none;
      }

      tr.collapsed td.swimlane-label {
        border-radius: 8px;
        padding: 8px 14px;
      }

      .cell {
        background: #e4e8ee;
        border-radius: 8px;
        padding: 8px;
        vertical-align: top;
        min-height: 100px;
      }

      .cell.drag-over {
        background: #cdd3de;
      }

      .card {
        background: #fff;
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 8px;
        box-shadow: 0 1px 3px rgba(7, 63, 137, 0.1);
        font-size: 0.88rem;
        line-height: 1.4;
        border-left: 4px solid transparent;
        cursor: grab;
        transition:
          opacity 0.2s,
          box-shadow 0.2s;
      }

      .card:last-child {
        margin-bottom: 0;
      }

      .card:active {
        cursor: grabbing;
      }

      .card.dragging {
        opacity: 0.4;
      }

      .card .name {
        font-weight: 600;
        color: #162D59;
      }

      .card .meta {
        font-size: 0.78rem;
        color: #5a6a7a;
        margin-top: 4px;
      }

      .card .comment {
        font-size: 0.78rem;
        color: #555;
        margin-top: 4px;
        font-style: italic;
      }

      .empty-msg {
        text-align: center;
        color: #999;
        padding: 40px 20px;
        font-size: 0.95rem;
      }

      .cell-empty {
        color: #bbb;
        font-size: 0.8rem;
        text-align: center;
        padding: 20px 10px;
      }

      /* Modal Styles (shared between edit and settings) */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(22, 45, 89, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal-content {
        background: #fff;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 4px 16px rgba(7, 63, 137, 0.2);
        width: 90%;
        max-width: 400px;
      }

      .modal-content.wide {
        max-width: 500px;
      }

      .modal-header {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 16px;
        color: #073f89;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 6px;
        color: #444;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #c0c8d4;
        border-radius: 4px;
        font-size: 0.9rem;
        font-family: inherit;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        outline: none;
        border-color: #3a63b8;
        box-shadow: 0 0 0 2px rgba(58, 99, 184, 0.15);
      }

      .form-group input:disabled {
        background: #f5f5f5;
        color: #999;
        cursor: not-allowed;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }

      .form-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        font-size: 0.9rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn-primary {
        background: #073f89;
        color: #fff;
      }

      .btn-primary:hover {
        background: #062f66;
      }

      .btn-secondary {
        background: #e0e4ea;
        color: #162D59;
      }

      .btn-secondary:hover {
        background: #d0d5de;
      }

      /* Sort Toggle Switch */
      .sort-toggle-container {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 20px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #a0aab8;
        transition: 0.3s;
        border-radius: 20px;
      }

      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 2px;
        bottom: 2px;
        background-color: white;
        transition: 0.3s;
        border-radius: 50%;
      }

      input:checked + .toggle-slider {
        background-color: #3a63b8;
      }

      input:checked + .toggle-slider:before {
        transform: translateX(20px);
      }

      .sort-toggle-label {
        font-size: 0.9rem;
        font-weight: 500;
        white-space: nowrap;
      }

      /* Checkbox list for card fields */
      .checkbox-list {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #c0c8d4;
        border-radius: 4px;
        padding: 8px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        font-size: 0.9rem;
        color: #1a1a1a;
      }

      .checkbox-item input[type="checkbox"] {
        width: auto;
        margin: 0;
        accent-color: #073f89;
      }

      /* Rich text editor */
      .richtext-wrapper {
        border: 1px solid #c0c8d4;
        border-radius: 4px;
        overflow: hidden;
      }

      .richtext-wrapper:focus-within {
        border-color: #3a63b8;
        box-shadow: 0 0 0 2px rgba(58, 99, 184, 0.15);
      }

      .richtext-toolbar {
        display: flex;
        gap: 2px;
        padding: 4px 6px;
        background: #f5f7fa;
        border-bottom: 1px solid #c0c8d4;
      }

      .richtext-toolbar button {
        background: none;
        border: 1px solid transparent;
        border-radius: 3px;
        padding: 3px 8px;
        font-size: 0.82rem;
        font-family: inherit;
        cursor: pointer;
        color: #162D59;
        line-height: 1.2;
      }

      .richtext-toolbar button:hover {
        background: #e0e4ea;
        border-color: #c0c8d4;
      }

      .richtext-editor {
        min-height: 80px;
        padding: 8px 10px;
        font-size: 0.9rem;
        font-family: inherit;
        outline: none;
        line-height: 1.5;
        color: #1a1a1a;
      }

      .richtext-editor:empty:before {
        content: attr(data-placeholder);
        color: #a0aab8;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>KARL STORZ &mdash; Kanban Board</h1>
      <div class="filter-bar">
        <label for="role-filter">{{ board_col_name }}:</label>
        <select id="role-filter">
          <option value="">All</option>
          {% for role in roles %}
          <option value="{{ role }}">{{ role }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-bar">
        <label for="jg-filter">{{ swim_col_name }}:</label>
        <select id="jg-filter">
          <option value="">All</option>
          {% for jg in jgs %}
          <option value="{{ jg }}">{{ jg }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="sort-toggle-container">
        <label class="sort-toggle-label" for="sort-by-count"
          >Sort by Count:</label
        >
        <label class="toggle-switch">
          <input type="checkbox" id="sort-by-count" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="file-bar">
        <span class="filename" id="current-file" title="{{ filename }}"
          >{{ filename }}</span
        >
        <input type="file" id="file-input" accept=".xlsx" hidden />
        <button type="button" id="load-btn">Load file...</button>
        <button type="button" id="settings-btn">Settings</button>
      </div>
    </header>

    <div class="legend" id="legend"></div>

    <div class="board-wrapper">
      <table class="board-table" id="board"></table>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
      <div class="modal-content">
        <div class="modal-header">Edit Person</div>
        <form id="edit-form">
          <div class="form-group">
            <label for="edit-name">Name</label>
            <input type="text" id="edit-name" disabled />
          </div>
          <div id="edit-fields-container"></div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="edit-cancel">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
      <div class="modal-content wide">
        <div class="modal-header">Column Mapping</div>
        <form id="settings-form">
          <div class="form-group">
            <label for="cfg-board-col">Board Columns</label>
            <select id="cfg-board-col"></select>
          </div>
          <div class="form-group">
            <label for="cfg-swim-col">Swimlane Rows</label>
            <select id="cfg-swim-col"></select>
          </div>
          <div class="form-group">
            <label>Card Header</label>
            <input type="text" id="cfg-card-header" value="Name" disabled />
          </div>
          <div class="form-group">
            <label>Card Fields (shown in cells)</label>
            <div class="checkbox-list" id="cfg-card-fields"></div>
          </div>
          <div class="form-group">
            <label>Dropdown Fields (use dropdown instead of text input when editing)</label>
            <div class="checkbox-list" id="cfg-dropdown-fields"></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="settings-cancel">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const boardEl = document.getElementById("board");
      const legendEl = document.getElementById("legend");
      const roleFilterEl = document.getElementById("role-filter");
      const jgFilterEl = document.getElementById("jg-filter");
      const sortByCountToggle = document.getElementById("sort-by-count");
      const editModal = document.getElementById("edit-modal");
      const editForm = document.getElementById("edit-form");
      const editNameInput = document.getElementById("edit-name");
      const editFieldsContainer = document.getElementById("edit-fields-container");
      const editCancelBtn = document.getElementById("edit-cancel");

      const settingsModal = document.getElementById("settings-modal");
      const settingsForm = document.getElementById("settings-form");
      const settingsBtn = document.getElementById("settings-btn");
      const settingsCancelBtn = document.getElementById("settings-cancel");
      const cfgBoardCol = document.getElementById("cfg-board-col");
      const cfgSwimCol = document.getElementById("cfg-swim-col");
      const cfgCardHeader = document.getElementById("cfg-card-header");
      const cfgCardFields = document.getElementById("cfg-card-fields");
      const cfgDropdownFields = document.getElementById("cfg-dropdown-fields");

      const PALETTE = [
        "#2ecc71",
        "#3498db",
        "#9b59b6",
        "#e67e22",
        "#e74c3c",
        "#1abc9c",
        "#f39c12",
        "#8e44ad",
        "#2980b9",
        "#27ae60",
        "#d35400",
        "#c0392b",
        "#16a085",
        "#7f8c8d",
        "#2c3e50",
        "#e84393",
        "#00b894",
        "#6c5ce7",
        "#fdcb6e",
        "#0984e3",
      ];

      let roleColorMap = {};
      let columnOrder = [];
      let cachedData = null;
      let currentEditingPerson = null;
      let sortByCellCount = false;
      let originalRoles = [];

      function getTotalCountByRole() {
        const counts = {};
        if (!cachedData || !cachedData.roles) return counts;

        cachedData.roles.forEach((role) => {
          counts[role] = 0;
        });

        Object.values(cachedData.swimlanes).forEach((jgData) => {
          Object.entries(jgData).forEach(([role, people]) => {
            counts[role] = (counts[role] || 0) + people.length;
          });
        });

        return counts;
      }

      function sortColumnsByCount() {
        if (!cachedData || !cachedData.roles) return;

        const counts = getTotalCountByRole();

        const sorted = [...columnOrder].sort((a, b) => {
          const countA = counts[a] || 0;
          const countB = counts[b] || 0;
          return countB - countA;
        });

        columnOrder = sorted;
      }

      function buildColorMap(roles) {
        roleColorMap = {};
        roles.forEach((name, i) => {
          roleColorMap[name] = PALETTE[i % PALETTE.length];
        });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function showEditModal(person) {
        currentEditingPerson = person;
        editNameInput.value = person.name;

        // Dynamically build form fields from card_fields
        const cardFields = cachedData.card_fields || [];
        const fieldOptions = cachedData.field_options || {};
        editFieldsContainer.innerHTML = "";
        for (const field of cardFields) {
          const group = document.createElement("div");
          group.className = "form-group";
          const label = document.createElement("label");
          label.textContent = field;
          label.setAttribute("for", "edit-field-" + field);
          group.appendChild(label);

          const options = fieldOptions[field];
          if (options && options.length > 0) {
            // Render as dropdown
            const select = document.createElement("select");
            select.id = "edit-field-" + field;
            select.dataset.field = field;
            const emptyOpt = document.createElement("option");
            emptyOpt.value = "";
            emptyOpt.textContent = "— select —";
            select.appendChild(emptyOpt);
            for (const opt of options) {
              const o = document.createElement("option");
              o.value = opt;
              o.textContent = opt;
              if (opt === String(person[field] || "")) o.selected = true;
              select.appendChild(o);
            }
            group.appendChild(select);
          } else {
            const wrapper = document.createElement("div");
            wrapper.className = "richtext-wrapper";

            const toolbar = document.createElement("div");
            toolbar.className = "richtext-toolbar";
            const buttons = [
              { cmd: "bold", label: "<b>B</b>" },
              { cmd: "italic", label: "<i>I</i>" },
              { cmd: "underline", label: "<u>U</u>" },
              { cmd: "insertUnorderedList", label: "List" },
            ];
            for (const btn of buttons) {
              const b = document.createElement("button");
              b.type = "button";
              b.innerHTML = btn.label;
              b.addEventListener("mousedown", (e) => {
                e.preventDefault();
                document.execCommand(btn.cmd, false, null);
              });
              toolbar.appendChild(b);
            }
            wrapper.appendChild(toolbar);

            const editor = document.createElement("div");
            editor.className = "richtext-editor";
            editor.contentEditable = "true";
            editor.dataset.field = field;
            editor.innerHTML = person[field] || "";
            editor.dataset.placeholder = field;
            wrapper.appendChild(editor);

            group.appendChild(wrapper);
          }

          editFieldsContainer.appendChild(group);
        }

        editModal.classList.add("active");
      }

      function closeEditModal() {
        editModal.classList.remove("active");
        currentEditingPerson = null;
        editForm.reset();
      }

      // Settings modal
      async function openSettingsModal() {
        const res = await fetch("/api/columns");
        if (!res.ok) return;
        const data = await res.json();
        const columns = data.columns;
        const config = data.config;

        // Populate board column dropdown
        cfgBoardCol.innerHTML = "";
        for (const col of columns) {
          const opt = document.createElement("option");
          opt.value = col;
          opt.textContent = col;
          if (col === config.board_column) opt.selected = true;
          cfgBoardCol.appendChild(opt);
        }

        // Populate swimlane column dropdown
        cfgSwimCol.innerHTML = "";
        for (const col of columns) {
          const opt = document.createElement("option");
          opt.value = col;
          opt.textContent = col;
          if (col === config.swimlane_column) opt.selected = true;
          cfgSwimCol.appendChild(opt);
        }

        // Card header (fixed)
        cfgCardHeader.value = config.card_header;

        // Card fields checkboxes (exclude card_header)
        const dropdownFields = config.dropdown_fields || [];
        cfgCardFields.innerHTML = "";
        const excluded = new Set([config.card_header]);
        for (const col of columns) {
          if (excluded.has(col)) continue;
          const item = document.createElement("label");
          item.className = "checkbox-item";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.value = col;
          cb.checked = config.card_fields.includes(col);
          cb.addEventListener("change", () => updateDropdownFieldsList());
          item.appendChild(cb);
          item.appendChild(document.createTextNode(col));
          cfgCardFields.appendChild(item);
        }

        // Populate dropdown fields list based on selected card fields
        function updateDropdownFieldsList() {
          const selectedCardFields = [];
          cfgCardFields.querySelectorAll("input[type=checkbox]:checked").forEach((cb) => {
            selectedCardFields.push(cb.value);
          });
          cfgDropdownFields.innerHTML = "";
          for (const field of selectedCardFields) {
            const item = document.createElement("label");
            item.className = "checkbox-item";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.value = field;
            cb.checked = dropdownFields.includes(field);
            item.appendChild(cb);
            item.appendChild(document.createTextNode(field));
            cfgDropdownFields.appendChild(item);
          }
        }
        updateDropdownFieldsList();

        settingsModal.classList.add("active");
      }

      function closeSettingsModal() {
        settingsModal.classList.remove("active");
      }

      function renderLegend(roles) {
        legendEl.innerHTML =
          '<span class="legend-title">Roles:</span>' +
          roles
            .map(
              (name) =>
                `<span class="legend-item">
                        <span class="legend-swatch" style="background:${roleColorMap[name]}"></span>
                        ${escapeHtml(name)}
                    </span>`,
            )
            .join("");
      }

      async function loadBoard() {
        const params = new URLSearchParams();
        if (roleFilterEl.value) params.set("role", roleFilterEl.value);
        if (jgFilterEl.value) params.set("jg", jgFilterEl.value);
        const qs = params.toString() ? `?${params}` : "";

        const res = await fetch(`/api/board${qs}`);
        cachedData = await res.json();

        if (cachedData.roles) {
          columnOrder = [...cachedData.roles];
          originalRoles = [...cachedData.roles];

          if (sortByCellCount) {
            sortColumnsByCount();
          }
        }

        renderBoard();
      }

      function renderBoard() {
        if (!cachedData) return;

        const { jgs, swimlanes, card_fields } = cachedData;
        const roles = columnOrder;

        boardEl.innerHTML = "";

        if (!roles || roles.length === 0 || !jgs || jgs.length === 0) {
          boardEl.innerHTML =
            '<tr><td class="empty-msg">No entries found for the selected filters.</td></tr>';
          legendEl.innerHTML = "";
          return;
        }

        buildColorMap(roles);
        renderLegend(roles);

        // Header row with draggable columns
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");

        const jgHeader = document.createElement("th");
        jgHeader.className = "jg-header";
        jgHeader.innerHTML = '<span class="toggle">&#9660;</span>JG';
        jgHeader.draggable = false;
        jgHeader.addEventListener("click", () => {
          const allJgRows = document.querySelectorAll("tr[data-jg]");
          const allCollapsed = jgHeader.classList.contains("all-collapsed");

          allJgRows.forEach((row) => {
            if (allCollapsed) {
              row.classList.remove("collapsed");
              const swimlaneLabel = row.querySelector(".swimlane-label");
              if (swimlaneLabel) swimlaneLabel.classList.remove("collapsed");
            } else {
              row.classList.add("collapsed");
              const swimlaneLabel = row.querySelector(".swimlane-label");
              if (swimlaneLabel) swimlaneLabel.classList.add("collapsed");
            }
          });

          jgHeader.classList.toggle("all-collapsed");
        });
        headerRow.appendChild(jgHeader);

        const counts = getTotalCountByRole();

        for (const role of roles) {
          const th = document.createElement("th");
          th.style.background = roleColorMap[role];
          const count = counts[role] || 0;
          th.textContent = `${role} (${count})`;
          th.draggable = true;
          th.dataset.role = role;

          th.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/column", role);
            th.classList.add("dragging");
          });
          th.addEventListener("dragend", () => {
            th.classList.remove("dragging");
          });
          th.addEventListener("dragover", (e) => {
            e.preventDefault();
            th.classList.add("drag-over");
          });
          th.addEventListener("dragleave", () => {
            th.classList.remove("drag-over");
          });
          th.addEventListener("drop", (e) => {
            e.preventDefault();
            th.classList.remove("drag-over");
            const draggedRole = e.dataTransfer.getData("text/column");
            if (!draggedRole || draggedRole === role) return;

            const fromIdx = columnOrder.indexOf(draggedRole);
            const toIdx = columnOrder.indexOf(role);
            if (fromIdx !== -1 && toIdx !== -1) {
              columnOrder.splice(fromIdx, 1);
              columnOrder.splice(toIdx, 0, draggedRole);
              renderBoard();
            }
          });

          headerRow.appendChild(th);
        }
        thead.appendChild(headerRow);
        boardEl.appendChild(thead);

        // Swimlane rows
        const tbody = document.createElement("tbody");
        for (const jg of jgs) {
          const tr = document.createElement("tr");
          tr.dataset.jg = jg;

          const jgCell = document.createElement("td");
          jgCell.className = "swimlane-label";
          jgCell.innerHTML = `<span class="toggle">&#9660;</span>${escapeHtml(String(jg))}`;
          jgCell.addEventListener("click", () => {
            tr.classList.toggle("collapsed");
            jgCell.classList.toggle("collapsed");
          });
          tr.appendChild(jgCell);

          for (const role of roles) {
            const td = document.createElement("td");
            td.className = "cell";
            td.dataset.role = role;
            td.dataset.jg = jg;

            const people = swimlanes[String(jg)]?.[role] || [];

            td.addEventListener("dragover", (e) => {
              e.preventDefault();
              td.classList.add("drag-over");
            });
            td.addEventListener("dragleave", () => {
              td.classList.remove("drag-over");
            });
            td.addEventListener("drop", async (e) => {
              e.preventDefault();
              td.classList.remove("drag-over");
              const name = e.dataTransfer.getData("text/plain");
              const newRole = td.dataset.role;
              const newJg = td.dataset.jg;
              if (!name) return;

              const res = await fetch("/api/move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  name,
                  new_role: newRole,
                  new_jg: newJg,
                }),
              });
              if (res.ok) loadBoard();
            });

            if (people.length === 0) {
              td.innerHTML = '<div class="cell-empty">-</div>';
            } else {
              for (const p of people) {
                const card = document.createElement("div");
                card.className = "card";
                card.style.borderLeftColor = roleColorMap[role];
                card.draggable = true;

                // Build card content dynamically
                let html = `<div class="name">${escapeHtml(p.name)}</div>`;
                for (const field of (card_fields || [])) {
                  const val = p[field];
                  if (val) {
                    html += `<div class="meta"><strong>${escapeHtml(field)}:</strong> ${String(val)}</div>`;
                  }
                }
                card.innerHTML = html;

                card.addEventListener("dragstart", (e) => {
                  e.dataTransfer.setData("text/plain", p.name);
                  card.classList.add("dragging");
                });
                card.addEventListener("dragend", () => {
                  card.classList.remove("dragging");
                });
                card.addEventListener("dblclick", () => {
                  showEditModal(p);
                });
                td.appendChild(card);
              }
            }

            tr.appendChild(td);
          }

          tbody.appendChild(tr);
        }
        boardEl.appendChild(tbody);
      }

      const fileInput = document.getElementById("file-input");
      const loadBtn = document.getElementById("load-btn");
      const currentFileEl = document.getElementById("current-file");

      // Edit modal event listeners
      editCancelBtn.addEventListener("click", closeEditModal);

      editModal.addEventListener("click", (e) => {
        if (e.target === editModal) closeEditModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (editModal.classList.contains("active")) closeEditModal();
          if (settingsModal.classList.contains("active")) closeSettingsModal();
        }
      });

      editForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!currentEditingPerson) return;

        const updatedData = { name: currentEditingPerson.name };
        // Collect values from dynamic fields (selects and rich text editors)
        editFieldsContainer.querySelectorAll("[data-field]").forEach((el) => {
          if (el.contentEditable === "true") {
            updatedData[el.dataset.field] = el.innerHTML.trim();
          } else {
            updatedData[el.dataset.field] = el.value;
          }
        });

        try {
          const res = await fetch("/api/edit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updatedData),
          });

          if (res.ok) {
            closeEditModal();
            loadBoard();
          } else {
            const err = await res.json();
            alert(err.error || "Failed to save changes");
          }
        } catch (error) {
          alert("Error saving changes: " + error.message);
        }
      });

      // Settings modal event listeners
      settingsBtn.addEventListener("click", openSettingsModal);
      settingsCancelBtn.addEventListener("click", closeSettingsModal);
      settingsModal.addEventListener("click", (e) => {
        if (e.target === settingsModal) closeSettingsModal();
      });

      settingsForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const selectedFields = [];
        cfgCardFields.querySelectorAll("input[type=checkbox]:checked").forEach((cb) => {
          selectedFields.push(cb.value);
        });

        const selectedDropdowns = [];
        cfgDropdownFields.querySelectorAll("input[type=checkbox]:checked").forEach((cb) => {
          selectedDropdowns.push(cb.value);
        });

        const config = {
          board_column: cfgBoardCol.value,
          swimlane_column: cfgSwimCol.value,
          card_fields: selectedFields,
          dropdown_fields: selectedDropdowns,
        };

        try {
          const res = await fetch("/api/columns", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(config),
          });

          if (res.ok) {
            closeSettingsModal();
            window.location.reload();
          } else {
            const err = await res.json();
            alert(err.error || "Failed to save settings");
          }
        } catch (error) {
          alert("Error saving settings: " + error.message);
        }
      });

      loadBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];
        if (!file) return;
        const form = new FormData();
        form.append("file", file);
        const res = await fetch("/api/upload", { method: "POST", body: form });
        if (res.ok) {
          const data = await res.json();
          currentFileEl.textContent = data.filename;
          currentFileEl.title = data.filename;
          window.location.reload();
        } else {
          const err = await res.json();
          alert(err.error || "Upload failed");
        }
        fileInput.value = "";
      });

      roleFilterEl.addEventListener("change", loadBoard);
      jgFilterEl.addEventListener("change", loadBoard);

      // Sort by count toggle
      sortByCountToggle.addEventListener("change", () => {
        sortByCellCount = sortByCountToggle.checked;
        if (sortByCellCount) {
          sortColumnsByCount();
        } else {
          columnOrder = [...originalRoles];
        }
        renderBoard();
      });

      loadBoard();
    </script>
  </body>
</html>
