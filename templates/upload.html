<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARL STORZ - Kanban Board</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Helvetica, Arial, sans-serif;
            background: #eef1f5;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-container {
            background: #fff;
            border-radius: 12px;
            padding: 48px;
            box-shadow: 0 4px 20px rgba(7, 63, 137, 0.12);
            text-align: center;
            max-width: 420px;
        }

        h1 {
            font-size: 1.5rem;
            color: #073f89;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .subtitle {
            font-size: 1rem;
            color: #162D59;
            margin-bottom: 12px;
            font-weight: 500;
        }

        p {
            color: #5a6a7a;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .drop-zone {
            border: 2px dashed #a0aab8;
            border-radius: 8px;
            padding: 40px 20px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: #3a63b8;
            background: #e8eef8;
        }

        .drop-zone-text {
            font-size: 0.95rem;
            color: #5a6a7a;
        }

        .drop-zone-text strong {
            color: #073f89;
        }

        input[type="file"] {
            display: none;
        }

        .error {
            color: #c0392b;
            margin-top: 16px;
            font-size: 0.88rem;
        }

        .loading {
            margin-top: 16px;
            color: #3a63b8;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h1>KARL STORZ</h1>
        <div class="subtitle">Kanban Board</div>
        <p>Select an Excel file (.xlsx) to load the board</p>
        <div class="drop-zone" id="drop-zone">
            <div class="drop-zone-text">
                <strong>Click to browse</strong> or drag and drop
            </div>
        </div>
        <input type="file" id="file-input" accept=".xlsx">
        <div class="error" id="error" style="display:none"></div>
        <div class="loading" id="loading" style="display:none">Uploading...</div>
    </div>

    <script>
        const dropZone = document.getElementById("drop-zone");
        const fileInput = document.getElementById("file-input");
        const errorEl = document.getElementById("error");
        const loadingEl = document.getElementById("loading");

        dropZone.addEventListener("click", () => fileInput.click());

        dropZone.addEventListener("dragover", e => {
            e.preventDefault();
            dropZone.classList.add("drag-over");
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("drag-over");
        });

        dropZone.addEventListener("drop", e => {
            e.preventDefault();
            dropZone.classList.remove("drag-over");
            const file = e.dataTransfer.files[0];
            if (file) uploadFile(file);
        });

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (file) uploadFile(file);
        });

        async function uploadFile(file) {
            if (!file.name.endsWith(".xlsx")) {
                errorEl.textContent = "Please select an .xlsx file";
                errorEl.style.display = "block";
                return;
            }
            errorEl.style.display = "none";
            loadingEl.style.display = "block";

            const form = new FormData();
            form.append("file", file);

            try {
                const res = await fetch("/api/upload", { method: "POST", body: form });
                if (res.ok) {
                    window.location.reload();
                } else {
                    const data = await res.json();
                    errorEl.textContent = data.error || "Upload failed";
                    errorEl.style.display = "block";
                }
            } catch (err) {
                errorEl.textContent = "Upload failed: " + err.message;
                errorEl.style.display = "block";
            } finally {
                loadingEl.style.display = "none";
            }
        }
    </script>
</body>
</html>
